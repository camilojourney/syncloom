# Evaluation contract for copy-relevance (part platform-variants). Frozen by evals/policy.toml.
# Rule (what "expected" means):
#   expected.products_in_copy = the sorted canonical names among Holus, Pilaster, Genpeli, Invoz that the thought itself names as whole words. A draft for the channel may name those and no other product; cases use thoughts whose product (if any) is in the first sentence.

[component]
id = "copy-relevance"
part = "platform-variants"
title = "Drafts name only the products the thought names"
schema_version = 1
smoke_only = false

[evaluator]
id = "structured_replay"
version = "1"

[evaluator.config]

[contract]
inputs = ["thought", "channel"]
outputs = ["record.text"]
optimizable = ["_build_platform_text"]
protected = ["evaluator", "cases", "collector", "policy", "e2e hook", "sealed cases"]
downstream = ["review-package"]

[[metrics]]
id = "match_fraction"
tier = "quality"
direction = "higher"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0
min_improvement = 0.05
on_error = 0.0
regression_tolerance = 0.0

[[metrics]]
id = "case_error"
tier = "reliability"
direction = "lower"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0

[[invariants]]
id = "schema_valid"
description = "The observation names the case and carries a finite JSON object."

[[invariants]]
id = "required_match"
description = "Every `required` field of the case matches the observation (hard, frozen-collector projections)."

[[planted_problems]]
id = "unrelated_product_pitch"
description = "The draft names a product (Holus) that the thought does not mention."
targets = ["match_fraction"]
min_sealed_cases = 3

[anti_gaming]
retention = 0.5

[cases]
group_keys = ["scenario"]

[cases.dev]
path = "cases/dev.jsonl"
sha256 = "e27dac057c9c608358555c62af439d3b89c0e32714e0d23eede8697052f936f9"
reviewer = "haiku-split-reviewer"

[baseline]
variant = "variants/baseline.toml"
run = ""

[reference]
variant = "variants/reference.toml"
