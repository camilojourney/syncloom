# Evaluation contract for source-intent (part source-understanding). Frozen by evals/policy.toml.
# Rule (what "expected" means):
#   expected.intent for a text thought: product_context when the thought names a configured portfolio product (Pilaster, Genpeli, Invoz) as a whole word, else campaign_idea when it contains campaign, launch or series, else research_note when it contains research, study, paper or benchmark, else raw_thought. URL sources (online_article) are not in the cases.

[component]
id = "source-intent"
part = "source-understanding"
title = "Source intent classification"
schema_version = 1
smoke_only = false

[evaluator]
id = "structured_replay"
version = "1"

[evaluator.config]

[contract]
inputs = ["thought", "source_type"]
outputs = ["source_context.source_intent"]
optimizable = ["_infer_source_intent"]
protected = ["evaluator", "cases", "collector", "policy", "e2e hook", "sealed cases"]
downstream = ["review-package"]

[[metrics]]
id = "match_fraction"
tier = "quality"
direction = "higher"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0
min_improvement = 0.05
on_error = 0.0
regression_tolerance = 0.0

[[metrics]]
id = "case_error"
tier = "reliability"
direction = "lower"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0

[[invariants]]
id = "schema_valid"
description = "The observation names the case and carries a finite JSON object."

[[invariants]]
id = "required_match"
description = "Every `required` field of the case matches the observation (hard, frozen-collector projections)."

[[planted_problems]]
id = "product_mention_undetected"
description = "A thought naming Genpeli or Invoz is not classified as product context."
targets = ["match_fraction"]
min_sealed_cases = 3

[[planted_problems]]
id = "product_substring_false_positive"
description = "A word that merely contains a product name (pilasters) is classified as product context."
targets = ["match_fraction"]
min_sealed_cases = 2

[anti_gaming]
retention = 0.5

[cases]
group_keys = ["scenario"]

[cases.dev]
path = "cases/dev.jsonl"
sha256 = "bea213ee0fafbf29d232e7397580b88507b5a154a14a344d275b763de076627b"
reviewer = "haiku-split-reviewer"

[baseline]
variant = "variants/baseline.toml"
run = ""

[reference]
variant = "variants/reference.toml"
