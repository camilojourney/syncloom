# Evaluation contract for language-route (part source-understanding). Frozen by evals/policy.toml.
# Rule (what "expected" means):
#   expected.language is the language a bilingual reviewer would assign to the thought as a whole (en or es); it decides the account handle shown in review. Single loanwords, place names and particles such as 'de', 'con', 'los', 'las' inside an English sentence do not make it Spanish; a Spanish sentence without accents or without common function words is still Spanish.

[component]
id = "language-route"
part = "source-understanding"
title = "Language route for the posting destination"
schema_version = 1
smoke_only = false

[evaluator]
id = "structured_replay"
version = "1"

[evaluator.config]

[contract]
inputs = ["thought"]
outputs = ["posting_destination.language"]
optimizable = ["detect_language_for_destination"]
protected = ["evaluator", "cases", "collector", "policy", "e2e hook", "sealed cases"]
downstream = ["review-package"]

[[metrics]]
id = "match_fraction"
tier = "quality"
direction = "higher"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0
min_improvement = 0.05
on_error = 0.0
regression_tolerance = 0.0

[[metrics]]
id = "case_error"
tier = "reliability"
direction = "lower"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0

[[invariants]]
id = "schema_valid"
description = "The observation names the case and carries a finite JSON object."

[[invariants]]
id = "required_match"
description = "Every `required` field of the case matches the observation (hard, frozen-collector projections)."

[[planted_problems]]
id = "english_spanish_lookalike"
description = "An English thought containing a Spanish-looking token (de, con, los, las, una, por) is routed to the Spanish account."
targets = ["match_fraction"]
min_sealed_cases = 3

[[planted_problems]]
id = "spanish_without_markers"
description = "A Spanish thought written without accents and without the listed function words is routed to the English account."
targets = ["match_fraction"]
min_sealed_cases = 3

[anti_gaming]
retention = 0.5

[cases]
group_keys = ["scenario"]

[cases.dev]
path = "cases/dev.jsonl"
sha256 = "384a2bc4ccb10e4cf98a1127002beeb6468f7047d4cababf112061d53c6832ac"
reviewer = "haiku-split-reviewer"

[baseline]
variant = "variants/baseline.toml"
run = ""

[reference]
variant = "variants/reference.toml"
