# Evaluation contract for platform-fit (part platform-variants). Frozen by evals/policy.toml.
# Rule (what "expected" means):
#   expected.verdict is REVIEW when the text is shorter than 20 characters or longer than the platform limit (linkedin 3000, threads 500, instagram 2200, facebook 63206, twitter_x 280 per thread segment where segments are blank-line-separated paragraphs starting with 'n/'), otherwise PASS. Limits are inclusive.

[component]
id = "platform-fit"
part = "platform-variants"
title = "Platform fit verdict on a draft"
schema_version = 1
smoke_only = false

[evaluator]
id = "structured_replay"
version = "1"

[evaluator.config]

[contract]
inputs = ["text", "platform", "content_type"]
outputs = ["quality.platform_fit.verdict"]
optimizable = ["_platform_fit", "platform_config"]
protected = ["evaluator", "cases", "collector", "policy", "e2e hook", "sealed cases"]
downstream = ["review-package"]

[[metrics]]
id = "match_fraction"
tier = "quality"
direction = "higher"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0
min_improvement = 0.05
on_error = 0.0
regression_tolerance = 0.0

[[metrics]]
id = "case_error"
tier = "reliability"
direction = "lower"
unit = "ratio"
primary = true
non_inferiority_margin = 0.0

[[invariants]]
id = "schema_valid"
description = "The observation names the case and carries a finite JSON object."

[[invariants]]
id = "required_match"
description = "Every `required` field of the case matches the observation (hard, frozen-collector projections)."

[[planted_problems]]
id = "twitter_segment_over_280"
description = "A thread segment longer than 280 characters still passes platform fit."
targets = ["match_fraction"]
min_sealed_cases = 3

[[planted_problems]]
id = "threads_over_500"
description = "A Threads post longer than 500 characters still passes platform fit."
targets = ["match_fraction"]
min_sealed_cases = 2

[[planted_problems]]
id = "instagram_over_2200"
description = "An Instagram caption longer than 2200 characters still passes platform fit."
targets = ["match_fraction"]
min_sealed_cases = 2

[anti_gaming]
retention = 0.5

[cases]
group_keys = ["scenario"]

[cases.dev]
path = "cases/dev.jsonl"
sha256 = "661f302a80b8f38f62f494e3ed7c5bb97bec7dbc159bab9eb23bf26d01a69178"
reviewer = "haiku-split-reviewer"

[baseline]
variant = "variants/baseline.toml"
run = ""

[reference]
variant = "variants/reference.toml"
