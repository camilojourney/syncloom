[workspace]
resolver = "3"
members = ["crates/syncloom-core", "crates/syncloom-server", "crates/syncloom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
syncloom-core = { path = "crates/syncloom-core" }
syncloom-server = { path = "crates/syncloom-server" }
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
lopdf = { version = "0.38", default-features = false }
png = "0.18"
ttf-parser = "0.25"
tokio-tungstenite = "0.28"
http-body-util = "0.1"
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util", "process"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
