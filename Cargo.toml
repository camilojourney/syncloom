[workspace]
resolver = "3"
members = ["crates/syncloom-core", "crates/syncloom-server", "crates/syncloom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
syncloom-core = { path = "crates/syncloom-core" }
syncloom-server = { path = "crates/syncloom-server" }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
